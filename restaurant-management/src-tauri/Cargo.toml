[package]
name = "natra-restaurant-management"
version = "0.1.0"
description = "NATRA — local-first restaurant management system"
edition = "2021"
default-run = "natra-restaurant-management"

[lib]
name = "natra_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Local database
rusqlite = { version = "0.31", features = ["bundled"] }

# Error handling
thiserror = "1"
anyhow = "1"

# Password hashing for admin/user login
bcrypt = "0.15"

# Dates
chrono = { version = "0.4", features = ["serde"] }

# Async runtime — used by the sync module to talk to Turso without
# blocking the Tauri command threads that hold the SQLite mutex.
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros", "sync"] }

# Writes the daily local backup as a real .xlsx file (see src/backup).
# Pure-Rust, no C compiler needed — same reasoning as the "remote"
# libsql feature below.
rust_xlsxwriter = "0.96"

# Turso/libSQL client for optional cloud sync (see src/sync/turso).
# "remote" is pure-Rust HTTP (Hrana) — no bundled SQLite/C compiler
# needed just to talk to a remote database over the wire.
libsql = { version = "0.9", default-features = false, features = ["remote"] }

# Pin: bcrypt -> zeroize 1.9+ requires Rust edition2024 (2024 toolchains
# only). Pin to 1.7.0 for broader toolchain compatibility; bump this
# once your build environment is on a current stable Rust.
zeroize = "=1.7.0"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
