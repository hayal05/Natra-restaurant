# Tag a commit `v0.2.0` (etc.) and this builds the Windows installers
# and attaches them to a GitHub Release. `tauri.conf.json`'s `version`
# field is not read here — the tag is the single source of truth for
# what gets released, so bump `package.json`/`tauri.conf.json` first
# and tag to match.

name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test

      # tauri-action builds the app AND creates/updates the GitHub
      # Release for the pushed tag, attaching the MSI/NSIS installers.
      # Draft first so a broken build never auto-publishes silently —
      # publish manually from the Releases page once it looks right.
      - name: Build and create release draft
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "NATRA Restaurant Management ${{ github.ref_name }}"
          releaseBody: "See CHANGELOG or commit history for details."
          releaseDraft: true
          prerelease: false
